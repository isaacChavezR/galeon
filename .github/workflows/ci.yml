name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxis JS
        run: |
          node --check main.js
          node --check preload.js
          node --check webview-preload.js
          node --check renderer/renderer.js
          node --check renderer/home.js
      - name: Tests del escudo (motor, extractor y sanidad de la lista)
        run: npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
