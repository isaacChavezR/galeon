<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galeón</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="header">
    <div id="brand" title="Galeón — tu tesoro, bien guardado">
      <svg width="22" height="22" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="#0A1F3C" stroke="#E8B84B" stroke-width="2.5"/>
        <path d="M11 49q6-5 11 0t11 0t11 0t11 0" fill="none" stroke="#2EC4B6" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M17 54q5-4 9 0t10 0" fill="none" stroke="#1E8F84" stroke-width="2" stroke-linecap="round" opacity=".65"/>
        <path d="M32 13v25" stroke="#E8B84B" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M32 10l8 2.6L32 15.2z" fill="#2EC4B6"/>
        <path d="M34 16q11 5.4 10 15.5L34 33z" fill="#F2E9D8"/>
        <path d="M30 18q-10 4.6-9 13.6L30 32.6z" fill="#E8B84B"/>
        <path d="M15.5 37h33l-5.5 8.5q-11 3.2-22 0z" fill="#E8B84B"/>
        <path d="M18.5 41h27" stroke="#B8860B" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      </svg>
      <span>Galeón</span>
    </div>
    <div id="tabbar"></div>
    <button id="newtab" title="Nueva pestaña (Ctrl+T)">+</button>
    <button id="newtab-private" title="Nueva pestaña privada (Ctrl+Shift+N)">🎭</button>
  </header>

  <div id="toolbar">
    <button class="tbtn" id="btn-back" title="Atrás (Alt+←)">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tbtn" id="btn-fwd" title="Adelante (Alt+→)">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tbtn" id="btn-reload" title="Recargar (F5)">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M18 3v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="tbtn" id="btn-home" title="Página de inicio">
      <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="urlwrap">
      <span id="https" title="Conexión segura">🔒</span>
      <input id="urlbar" placeholder="Busca con Galeón o escribe una dirección" spellcheck="false" autocomplete="off"/>
      <button class="tbtn" id="btn-star" title="Añadir a marcadores (Ctrl+D)">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button class="tbtn" id="btn-history" title="Historial local">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="shield" title="Rastreadores bloqueados en esta sesión">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.4-7 10-4-1.6-7-5.5-7-10V6z" fill="currentColor"/></svg>
      <span id="shield-count">0</span>
    </div>
    <div id="bottles" title="Cada 10 búsquedas retiran una botella de un río">
      <svg viewBox="0 0 24 24"><path d="M10 3h4v3.5c1.8 1 3 2.9 3 5V19a2 2 0 0 1-2 2h-6a2 2 0 0 1-2-2v-7.5c0-2.1 1.2-4 3-5z" fill="currentColor"/></svg>
      <span id="bottles-count">0</span>
    </div>
    <button class="tbtn" id="btn-menu" title="Menú de Galeón">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="appmenu" hidden>
    <button class="mi" data-ma="newwin">Nueva ventana <kbd>Ctrl+N</kbd></button>
    <button class="mi" data-ma="newwinpriv">Nueva ventana privada <kbd>Ctrl+Mayús+N</kbd></button>
    <button class="mi" data-ma="tabsearch">Buscar pestañas <kbd>Ctrl+Mayús+A</kbd></button>
    <div class="msep"></div>
    <div class="mrow">
      <span>Zoom</span>
      <span class="mzoom">
        <button id="mz-out" title="Reducir">−</button>
        <button id="mz-reset" title="Restablecer">100%</button>
        <button id="mz-in" title="Aumentar">＋</button>
      </span>
    </div>
    <div class="msep"></div>
    <button class="mi" data-ma="favoritos">Favoritos <kbd>Ctrl+Mayús+O</kbd></button>
    <button class="mi" data-ma="historial">Historial <kbd>Ctrl+H</kbd></button>
    <button class="mi" data-ma="descargas">Descargas <kbd>Ctrl+J</kbd></button>
    <div class="msep"></div>
    <button class="mi" data-ma="userscripts">Extensiones y userscripts</button>
    <button class="mi" data-ma="passwords">Contraseñas</button>
    <button class="mi" data-ma="datos">Eliminar datos de navegación… <kbd>Ctrl+Mayús+Supr</kbd></button>
    <div class="msep"></div>
    <button class="mi" data-ma="print">Imprimir… <kbd>Ctrl+P</kbd></button>
    <button class="mi" data-ma="translate">Traducir página…</button>
    <button class="mi" data-ma="shot">Capturar página <kbd>Ctrl+Mayús+S</kbd></button>
    <button class="mi" data-ma="find">Buscar en la página <kbd>Ctrl+F</kbd></button>
    <div class="msep"></div>
    <button class="mi" data-ma="ajustes">Configuración</button>
    <button class="mi" data-ma="admin">Acerca de Galeón (Diagnóstico)</button>
  </div>

  <div id="tabsearch" hidden>
    <input id="ts-input" placeholder="Buscar entre tus pestañas…" spellcheck="false" autocomplete="off"/>
    <div id="ts-list"></div>
  </div>

  <div id="loadbar"><div id="loadbar-fill"></div></div>

  <div id="bookmarksbar" hidden></div>

  <div id="shield-pop" hidden>
    <div class="sp-head">
      <strong>Escudo de Galeón</strong>
      <button id="sp-close" title="Cerrar">✕</button>
    </div>
    <p class="sp-line"><span id="sp-count">0</span> rastreadores bloqueados en <strong id="sp-site">—</strong> esta sesión</p>
    <p class="sp-line" id="sp-clean" title="utm_*, fbclid y demás rastreadores eliminados de tus enlaces">🧹 <span id="sp-clean-count">0</span> parámetros de rastreo limpiados de tus enlaces</p>
    <button id="sp-toggle">Desactivar escudo en este sitio</button>
    <button id="sp-ajustes">Todos los ajustes…</button>
    <button id="sp-admin">Panel de diagnóstico…</button>
  </div>

  <div id="findbar" hidden>
    <input id="find-input" placeholder="Buscar en la página" spellcheck="false"/>
    <span id="find-count"></span>
    <button class="tbtn" id="find-prev" title="Anterior (Mayús+Intro)">▲</button>
    <button class="tbtn" id="find-next" title="Siguiente (Intro)">▼</button>
    <button class="tbtn" id="find-close" title="Cerrar (Esc)">✕</button>
  </div>

  <main id="tabs-content"></main>

  <aside id="history-panel" hidden>
    <div class="panel-head">
      <strong>Historial local</strong>
      <span class="panel-note">solo en tu equipo</span>
      <button id="btn-clear-history">Limpiar</button>
      <button id="btn-close-history">✕</button>
    </div>
    <ul id="history-list"></ul>
  </aside>

  <div id="toasts"></div>

  <script src="renderer.js"></script>
</body>
</html>
