<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Favoritos — Galeón</title>
  <link rel="stylesheet" href="ajustes.css">
  <style>
    .fav { padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
    .fav:last-child { border-bottom: none; }
    .fav-title { font-size: 13.5px; color: var(--ink); }
    .fav-url { font-size: 11.5px; color: var(--teal); margin-top: 3px; font-family: Consolas, monospace; word-break: break-all; }
    .fav-btns { display: flex; gap: 6px; margin-top: 7px; }
    .fav-btns button {
      border: 1px solid rgba(255,255,255,.14); background: var(--navy-3); color: var(--ink);
      border-radius: 7px; padding: 4px 10px; font-size: 11.5px; cursor: pointer;
    }
    .fav-btns button:hover { border-color: var(--gold); color: var(--gold); }
    .fav-btns button.del { border-color: rgba(224,82,82,.4); color: #e05252; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Favoritos</h1>
      <p class="sub">Tus marcadores, solo en tu equipo. Marca páginas con la estrella ⭐ de la barra o Ctrl+D.</p>
    </header>
    <section>
      <div id="list"></div>
    </section>
  </div>
  <script src="favoritos.js"></script>
</body>
</html>
